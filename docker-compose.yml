services:
  web:
    build: .
    container_name: apache_php
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
    networks:
      - webnetz

  worker:
    build: .
    container_name: telemetry_worker
    restart: unless-stopped
    command: php /var/www/html/cron/runner.php
    environment:
      GENERATOR_INTERVAL: 5
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
    networks:
      - webnetz

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpasswort
      MYSQL_DATABASE: iot_telemetrie
      MYSQL_USER: meinuser
      MYSQL_PASSWORD: meinpasswort
    volumes:
      - mysql_data:/var/lib/mysql
      - ./www/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - webnetz

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - webnetz

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - webnetz

volumes:
  mysql_data:
  portainer_data:

networks:
  webnetz:
